/* ===========================================================
   Google Drive 讀寫（REST API，透過 fetch）
=========================================================== */
async function driveReadPublic(fileId) {
  // 訪客讀取：不需登入，用 API Key 讀取「連結任何人可檢視」的檔案
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${CONFIG.API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("讀取失敗 (" + res.status + ")");
  return await res.json();
}
async function driveReadAuthed(fileId, accessToken) {
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!res.ok) throw new Error("讀取失敗 (" + res.status + ")");
  return await res.json();
}
async function driveWrite(fileId, accessToken, dataObj) {
  const url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
  const res = await fetch(url, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(dataObj),
  });
  if (!res.ok) throw new Error("寫入失敗 (" + res.status + ")");
  return await res.json();
}
async function driveCreateFile(accessToken, name, dataObj) {
  const boundary = "-------familytree" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dataObj)}\r\n--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error("建立檔案失敗 (" + res.status + ")");
  return await res.json(); // { id, ... }
}
async function drivePublicShare(fileId, accessToken) {
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ role: "reader", type: "anyone" }),
  });
}
async function driveShareEditor(fileId, accessToken, email) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ role: "writer", type: "user", emailAddress: email }),
  });
  if (!res.ok) throw new Error("分享編輯權限失敗 (" + res.status + ")，請確認你自己是否有分享權限");
  return await res.json();
}

/* ===========================================================
   權限工具
=========================================================== */
function getDescendantIds(persons, rootId) {
  const out = new Set([rootId]);
  const stack = [rootId];
  while (stack.length) {
    const cur = stack.pop();
    Object.values(persons).forEach((p) => {
      if (p.parentId === cur && !out.has(p.id)) { out.add(p.id); stack.push(p.id); }
    });
  }
  Object.values(persons).forEach((p) => { if (out.has(p.id)) (p.spouseIds || []).forEach((sid) => out.add(sid)); });
  return out;
}
function computeDefaultCollapsed(persons, rootIds) {
  // 預設只展開到孫子輩（depth 0=公, 1=子女, 2=孫），depth>=2 的節點如果有子女就先收合，
  // 避免某一房資料筆數變多時，樹狀圖一開始就撐得太寬、把同輩的其他人擠出視野。
  const out = new Set();
  const visit = (id, depth) => {
    const children = Object.values(persons).filter((c) => c.parentId === id);
    if (depth >= 2 && children.length > 0) out.add(id);
    children.forEach((c) => visit(c.id, depth + 1));
  };
  rootIds.forEach((rid) => visit(rid, 0));
  return out;
}
function getAncestorChain(persons, id) {
  const chain = [];
  let cur = persons[id];
  while (cur && cur.parentId) {
    chain.push(cur.parentId);
    cur = persons[cur.parentId];
  }
  return chain;
}
function roleLabel(role) {
  if (role === "master") return "主管理者";
  if (role === "sub") return "副管理者";
  if (role && role.startsWith("node:")) return "節點管理者";
  return "訪客（唯讀）";
}

const iconBtnStyle = { border: "none", background: "transparent", cursor: "pointer", color: "var(--muted)", padding: 2, fontSize: 14 };
const miniBtnStyle = { display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11, border: "1px solid var(--gold)", background: "transparent", borderRadius: 5, padding: "3px 7px", cursor: "pointer", color: "var(--ink)" };
const inputStyle = { width: "100%", padding: "7px 9px", borderRadius: 6, border: "1px solid var(--gold)", background: "var(--card)", color: "var(--ink)", fontSize: 14, boxSizing: "border-box" };
const overlayStyle = { position: "fixed", inset: 0, background: "rgba(36,31,26,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 };
const modalStyle = { background: "var(--paper)", borderRadius: 10, padding: 20, width: "100%", maxWidth: 420, maxHeight: "88vh", overflowY: "auto", border: "1px solid var(--gold)", boxShadow: "0 10px 30px rgba(0,0,0,0.3)" };

function Seal({ text, tone }) {
  const bg = tone === "jade" ? "var(--jade)" : "var(--seal)";
  return (
    <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 30, height: 30, minWidth: 30, borderRadius: 4, background: bg, color: "var(--paper)", fontFamily: "var(--font-display)", fontSize: 13, fontWeight: 700, transform: "rotate(-2deg)", boxShadow: "1px 1px 0 rgba(0,0,0,0.25)" }}>
      {text}
    </span>
  );
}
function BirthLine({ p }) {
  if (!p.birthAdYear && !p.birthEra) return <span style={{ color: "var(--muted)", fontSize: 12 }}>生辰未詳</span>;
  return (
    <div style={{ lineHeight: 1.3 }}>
      {p.birthAdYear && <span style={{ fontFamily: "var(--font-num)", fontSize: 20, fontWeight: 700 }}>{p.birthAdYear}</span>}
      <div style={{ fontSize: 12, color: "var(--muted)" }}>{[p.birthEra, p.birthLunar, p.birthHour].filter(Boolean).join(" ")}</div>
      {p.deathNote && <div style={{ fontSize: 12, color: "var(--seal)" }}>{p.deathNote}</div>}
    </div>
  );
}
function FormRow({ label, children }) {
  return <div style={{ marginBottom: 8 }}><label style={{ display: "block", fontSize: 12, color: "var(--muted)", marginBottom: 3 }}>{label}</label>{children}</div>;
}

function PersonCard({ p, persons, canEditFn, onEdit, onAddChild, onAddSpouse, onAddParent, rootIdsSet, highlight }) {
  const isRoot = rootIdsSet && rootIdsSet.has(p.id);
  const spouses = (p.spouseIds || []).map((id) => persons[id]).filter(Boolean);
  const isHit = highlight && p.name.includes(highlight);
  const canEdit = canEditFn(p.id);
  return (
    <div style={{ border: `1.5px solid ${isHit ? "var(--seal)" : "var(--gold)"}`, borderRadius: 8, background: "var(--card)", padding: "10px 12px", minWidth: 190, boxShadow: isHit ? "0 0 0 3px rgba(155,46,35,0.15)" : "none" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Seal text={p.gender === "F" ? "女" : "男"} tone={p.gender === "F" ? "jade" : "seal"} />
        <div style={{ fontFamily: "var(--font-display)", fontSize: 17, fontWeight: 700 }}>{p.name}</div>
        {canEdit && <button onClick={() => onEdit(p.id)} title="編輯" style={iconBtnStyle}>✎</button>}
      </div>
      <div style={{ marginTop: 6 }}><BirthLine p={p} /></div>
      {p.note && <div style={{ marginTop: 4, fontSize: 12, color: "var(--muted)", fontStyle: "italic" }}>備註：{p.note}</div>}
      {spouses.length > 0 && (
        <div style={{ marginTop: 8, borderTop: "1px dashed var(--gold)", paddingTop: 6 }}>
          {spouses.map((s) => (
            <div key={s.id} style={{ display: "flex", alignItems: "flex-start", gap: 6, marginBottom: 4 }}>
              <span style={{ fontSize: 11, color: "var(--jade)", fontWeight: 700, marginTop: 2 }}>{s.spouseType || "配偶"}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{s.name}</div>
                <BirthLine p={s} />
              </div>
              {canEditFn(s.id) && <button onClick={() => onEdit(s.id)} title="編輯配偶" style={iconBtnStyle}>✎</button>}
            </div>
          ))}
        </div>
      )}
      {canEdit && (
        <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
          <button onClick={() => onAddSpouse(p.id)} style={miniBtnStyle}>＋配偶</button>
          <button onClick={() => onAddChild(p.id)} style={miniBtnStyle}>＋子女</button>
          {isRoot && onAddParent && <button onClick={() => onAddParent(p.id)} style={{ ...miniBtnStyle, borderColor: "var(--jade)", color: "var(--jade)" }}>＋上一代</button>}
        </div>
      )}
    </div>
  );
}

function TreeNode({ id, persons, collapsed, toggle, ...actions }) {
  const p = persons[id];
  if (!p) return null;
  const children = Object.values(persons).filter((c) => c.parentId === id).sort((a, b) => a.childOrder - b.childOrder);
  const isCollapsed = collapsed.has(id);
  return (
    <div data-person-id={id} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        {children.length > 0 && <button onClick={() => toggle(id)} style={{ ...iconBtnStyle, color: "var(--gold)" }}>{isCollapsed ? "▶" : "▼"}</button>}
        <PersonCard p={p} persons={persons} {...actions} />
      </div>
      {!isCollapsed && children.length > 0 && (
        <div style={{ position: "relative", marginTop: 18, paddingTop: 18, borderTop: "2px solid var(--gold)" }}>
          <div style={{ display: "flex", gap: 28 }}>
            {children.map((c) => (
              <div key={c.id} style={{ position: "relative" }}>
                <div style={{ position: "absolute", top: -18, left: "50%", width: 2, height: 18, background: "var(--gold)" }} />
                <TreeNode id={c.id} persons={persons} collapsed={collapsed} toggle={toggle} {...actions} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
function ListNode({ id, persons, depth, expanded, toggle, ...actions }) {
  const p = persons[id];
  if (!p) return null;
  const children = Object.values(persons).filter((c) => c.parentId === id).sort((a, b) => a.childOrder - b.childOrder);
  const isOpen = expanded.has(id);
  return (
    <div style={{ marginLeft: depth === 0 ? 0 : 20, marginTop: 10 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
        {children.length > 0 ? <button onClick={() => toggle(id)} style={{ ...iconBtnStyle, marginTop: 10, color: "var(--gold)" }}>{isOpen ? "▼" : "▶"}</button> : <span style={{ width: 18 }} />}
        <PersonCard p={p} persons={persons} {...actions} />
      </div>
      {isOpen && children.length > 0 && (
        <div style={{ borderLeft: "2px dotted var(--gold)", marginLeft: 9, paddingLeft: 10 }}>
          {children.map((c) => <ListNode key={c.id} id={c.id} persons={persons} depth={depth + 1} expanded={expanded} toggle={toggle} {...actions} />)}
        </div>
      )}
    </div>
  );
}

function PersonForm({ mode, initial, onCancel, onSave, onDelete, allPersons, personId }) {
  const [f, setF] = useState(initial);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const isSpouseRecord = !!f.spouseOf;

  const parentOptions = useMemo(() => {
    if (mode !== "edit" || isSpouseRecord || !allPersons || !personId) return [];
    const excluded = getDescendantIds(allPersons, personId); // 排除自己與所有子孫（避免造成循環）
    return Object.values(allPersons)
      .filter((p) => !excluded.has(p.id) && !p.spouseOf)
      .sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
  }, [allPersons, personId, mode, isSpouseRecord]);

  return (
    <div style={overlayStyle}>
      <div style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <h3 style={{ fontFamily: "var(--font-display)", fontSize: 18, margin: 0 }}>{mode === "edit" ? "編輯人物" : mode === "spouse" ? "新增配偶" : "新增子女"}</h3>
          <button onClick={onCancel} style={iconBtnStyle}>✕</button>
        </div>
        <FormRow label="姓名"><input style={inputStyle} value={f.name} onChange={set("name")} /></FormRow>
        <FormRow label="性別">
          <select style={inputStyle} value={f.gender} onChange={set("gender")}><option value="M">男</option><option value="F">女</option></select>
        </FormRow>
        {mode === "spouse" && (
          <FormRow label="配偶關係">
            <select style={inputStyle} value={f.spouseType || "配偶"} onChange={set("spouseType")}>
              <option value="配偶">配偶</option><option value="原配">原配</option><option value="繼配">繼配</option>
            </select>
          </FormRow>
        )}
        {mode === "edit" && !isSpouseRecord && (
          <FormRow label="上層（父親）">
            <select style={inputStyle} value={f.parentId || ""} onChange={(e) => setF({ ...f, parentId: e.target.value || null })}>
              <option value="">（設為頂層祖先，不隸屬任何人）</option>
              {parentOptions.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </FormRow>
        )}
        <FormRow label="西元出生年"><input style={inputStyle} type="number" value={f.birthAdYear || ""} onChange={(e) => setF({ ...f, birthAdYear: e.target.value ? Number(e.target.value) : null })} /></FormRow>
        <FormRow label="朝代干支年"><input style={inputStyle} placeholder="例：清光緒己亥年（25年）" value={f.birthEra || ""} onChange={set("birthEra")} /></FormRow>
        <FormRow label="農曆日期"><input style={inputStyle} placeholder="例：2月28日" value={f.birthLunar || ""} onChange={set("birthLunar")} /></FormRow>
        <FormRow label="時辰"><input style={inputStyle} placeholder="例：戌時" value={f.birthHour || ""} onChange={set("birthHour")} /></FormRow>
        <FormRow label="卒亡／享壽備註"><input style={inputStyle} placeholder="例：享壽61歲" value={f.deathNote || ""} onChange={set("deathNote")} /></FormRow>

/* ===========================================================
   主程式
=========================================================== */
function App() {
  const [persons, setPersons] = useState(null);
  const [rootIds, setRootIds] = useState([]);
  const [roles, setRoles] = useState(null);
  const [signedInEmail, setSignedInEmail] = useState(null);
  const [accessToken, setAccessToken] = useState(null);
  const [session, setSession] = useState(null); // { role }
  const [viewMode, setViewMode] = useState("tree");
  const [search, setSearch] = useState("");
  const [collapsed, setCollapsed] = useState(new Set());
  const [expanded, setExpanded] = useState(new Set());
  const [formState, setFormState] = useState(null);
  const [showManage, setShowManage] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState("");
  const tokenClientRef = useRef(null);

  const [setupBusy, setSetupBusy] = useState(false);
  const [setupResultFileId, setSetupResultFileId] = useState("");
  const [setupErr, setSetupErr] = useState("");

  const needsSetup = !CONFIG.FILE_ID;

  // 初始化 Google Identity Services token client
  useEffect(() => {
    const wait = setInterval(() => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: CONFIG.CLIENT_ID,
          scope: CONFIG.SCOPES,
          callback: async (resp) => {
            if (resp.error) { setLoadErr("登入失敗：" + resp.error); return; }
            setAccessToken(resp.access_token);
            try {
              const info = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                headers: { Authorization: `Bearer ${resp.access_token}` },
              }).then((r) => r.json());
              setSignedInEmail(info.email);
            } catch (e) { setLoadErr("取得帳號資訊失敗"); }
          },
        });
        clearInterval(wait);
      }
    }, 200);
    return () => clearInterval(wait);
  }, []);

  const signIn = () => tokenClientRef.current && tokenClientRef.current.requestAccessToken();
  const signOut = () => { setAccessToken(null); setSignedInEmail(null); setSession(null); };

  // 讀取資料（有 FILE_ID 才讀）
  useEffect(() => {
    if (needsSetup) { setLoading(false); return; }
    (async () => {
      try {
        const data = accessToken
          ? await driveReadAuthed(CONFIG.FILE_ID, accessToken)
          : await driveReadPublic(CONFIG.FILE_ID);
        const safePersons = data && data.persons ? data.persons : {};
        const safeRootIds = data && data.rootIds ? data.rootIds : [];
        setPersons(safePersons);
        setRootIds(safeRootIds);
        setRoles((data && data.roles) || { masterEmail: null, admins: [], nodeAdmins: [] });
        setCollapsed(computeDefaultCollapsed(safePersons, safeRootIds));
      } catch (e) {
        setLoadErr("讀取家族資料失敗：" + e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, [needsSetup, accessToken]);

  // 根據登入 email + roles 決定 session 角色
  useEffect(() => {
    if (!signedInEmail || !roles) { setSession(null); return; }
    if (roles.masterEmail === signedInEmail) { setSession({ role: "master" }); return; }
    if ((roles.admins || []).some((a) => a.email === signedInEmail)) { setSession({ role: "sub" }); return; }
    const node = (roles.nodeAdmins || []).find((a) => a.email === signedInEmail);
    if (node) { setSession({ role: "node:" + node.nodeId }); return; }
    setSession(null);
  }, [signedInEmail, roles]);

  const persistAll = useCallback(async (newPersons, newRootIds, newRoles) => {
    const finalPersons = newPersons || persons;
    const finalRootIds = newRootIds || rootIds;
    const finalRoles = newRoles || roles;
    setPersons(finalPersons); setRootIds(finalRootIds); setRoles(finalRoles);
    if (!accessToken) { setLoadErr("尚未登入，無法儲存"); return; }
    try {
      await driveWrite(CONFIG.FILE_ID, accessToken, { persons: finalPersons, rootIds: finalRootIds, roles: finalRoles });
    } catch (e) {
      setLoadErr("儲存失敗：" + e.message);
    }
  }, [persons, rootIds, roles, accessToken]);

  const canEditPerson = useCallback((personId) => {
    if (!session) return false;
    if (session.role === "master" || session.role === "sub") return true;
    if (session.role.startsWith("node:")) {
      const nodeId = session.role.slice(5);
      if (!persons) return false;
      return getDescendantIds(persons, nodeId).has(personId);
    }
    return false;
  }, [session, persons]);

  const handleClaimMaster = async () => {
    const newRoles = { masterEmail: signedInEmail, admins: [], nodeAdmins: [] };
    await persistAll(null, null, newRoles);
  };
  const handleAddRole = async ({ email, role, nodeId }) => {
    const newRoles = { ...roles };
    if (role === "sub") newRoles.admins = [...(roles.admins || []), { email }];
    else newRoles.nodeAdmins = [...(roles.nodeAdmins || []), { email, nodeId }];
    await persistAll(null, null, newRoles);
  };
  const handleRemoveRole = async (kind, idx) => {
    const newRoles = { ...roles };
    if (kind === "sub") newRoles.admins = roles.admins.filter((_, i) => i !== idx);
    else newRoles.nodeAdmins = roles.nodeAdmins.filter((_, i) => i !== idx);
    await persistAll(null, null, newRoles);
  };

  const openEdit = (personId) => setFormState({ mode: "edit", personId });
  const openAddSpouse = (personId) => setFormState({ mode: "spouse", personId, initial: { name: "", gender: "F", birthAdYear: null, birthEra: "", birthLunar: "", birthHour: "", deathNote: "", note: "", spouseType: "配偶" } });
  const openAddChild = (personId) => setFormState({ mode: "child", personId, initial: { name: "", gender: "M", birthAdYear: null, birthEra: "", birthLunar: "", birthHour: "", deathNote: "", note: "" } });
  const openAddParent = (personId) => setFormState({ mode: "parent", personId });

  const handleSaveForm = async (f) => {
    const newPersons = { ...persons };
    let newRootIds = rootIds;
    if (formState.mode === "edit") {
      const oldParentId = persons[formState.personId].parentId || null;
      const newParentId = f.parentId || null;
      newPersons[formState.personId] = { ...newPersons[formState.personId], ...f, parentId: newParentId };
      if (newParentId !== oldParentId) {
        const isCurrentlyRoot = rootIds.includes(formState.personId);
        if (newParentId === null && !isCurrentlyRoot) {
          newRootIds = [...rootIds, formState.personId];
        } else if (newParentId !== null && isCurrentlyRoot) {
          newRootIds = rootIds.filter((id) => id !== formState.personId);
        }
      }
    } else if (formState.mode === "spouse") {
      const spouseId = uid();
      newPersons[spouseId] = { id: spouseId, name: f.name, gender: f.gender, parentId: null, childOrder: 0, birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour, deathNote: f.deathNote, note: f.note, spouseIds: [formState.personId], spouseType: f.spouseType, spouseOf: formState.personId };
      newPersons[formState.personId] = { ...newPersons[formState.personId], spouseIds: [...(newPersons[formState.personId].spouseIds || []), spouseId] };
    } else if (formState.mode === "child") {
      const childId = uid();
      const siblingCount = Object.values(persons).filter((p) => p.parentId === formState.personId).length;
      newPersons[childId] = { id: childId, name: f.name, gender: f.gender, parentId: formState.personId, childOrder: siblingCount, birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour, deathNote: f.deathNote, note: f.note, spouseIds: [] };
    }
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };
  const handleDeletePerson = async () => {
    const id = formState.personId;
    const hasChildren = Object.values(persons).some((p) => p.parentId === id);
    if (hasChildren) { alert("此人物尚有子女紀錄，請先處理子女節點後再刪除。"); return; }
    const newPersons = { ...persons };
    delete newPersons[id];
    Object.values(newPersons).forEach((p) => { if ((p.spouseIds || []).includes(id)) p.spouseIds = p.spouseIds.filter((s) => s !== id); });
    const newRootIds = rootIds.filter((r) => r !== id);
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  // 新增上一代：建立全新的祖先，原本這個根節點變成新祖先的子女
  const handleCreateNewAncestor = async (f) => {
    const currentRootId = formState.personId;
    const newAncestorId = uid();
    const newPersons = { ...persons };
    newPersons[newAncestorId] = {
      id: newAncestorId, name: f.name, gender: f.gender, parentId: null, childOrder: 0,
      birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour,
      deathNote: f.deathNote, note: f.note, spouseIds: [], generationEra: f.generationEra || "",
    };
    newPersons[currentRootId] = { ...newPersons[currentRootId], parentId: newAncestorId };
    const newRootIds = rootIds.map((id) => (id === currentRootId ? newAncestorId : id));
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  // 新增上一代：歸到現有的另一位頂層祖先底下（例如兩房是兄弟，共用同一父親）
  const handleAttachExistingAncestor = async (existingAncestorId) => {
    const currentRootId = formState.personId;
    const newPersons = { ...persons };
    newPersons[currentRootId] = { ...newPersons[currentRootId], parentId: existingAncestorId };
    const newRootIds = rootIds.filter((id) => id !== currentRootId);
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  // 搜尋時：自動展開比對到的人物的所有祖先節點，並捲動到該卡片
  useEffect(() => {
    const term = search.trim();
    if (!term || !persons) return;
    const matches = Object.values(persons).filter((p) => p.name.includes(term));
    if (matches.length === 0) return;
    const ancestorIds = new Set();
    matches.forEach((m) => getAncestorChain(persons, m.id).forEach((id) => ancestorIds.add(id)));
    if (ancestorIds.size > 0) {
      setCollapsed((prev) => {
        const n = new Set(prev);
        ancestorIds.forEach((id) => n.delete(id));
        return n;
      });
      setExpanded((prev) => {
        const n = new Set(prev);
        ancestorIds.forEach((id) => n.add(id));
        return n;
      });
    }
    const t = setTimeout(() => {
      const el = document.querySelector(`[data-person-id="${matches[0].id}"]`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    }, 150);
    return () => clearTimeout(t);
  }, [search, persons]);

  const expandAll = () => setCollapsed(new Set());
  const collapseAll = () => {
    if (!persons) return;
    const all = new Set(Object.values(persons).filter((p) => Object.values(persons).some((c) => c.parentId === p.id)).map((p) => p.id));
    setCollapsed(all);
  };

  const toggleTreeNode = (id) => setCollapsed((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const toggleListNode = (id) => setExpanded((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const rootIdsSet = useMemo(() => new Set(rootIds), [rootIds]);

  const rootsByEra = useMemo(() => {
    if (!persons) return [];
    return rootIds.map((id) => persons[id]).filter(Boolean).sort((a, b) => (a.birthAdYear || 0) - (b.birthAdYear || 0));
  }, [persons, rootIds]);

  // ---- 初次部署引導 ----
  if (needsSetup) {
    return (
      <div style={{ minHeight: "100vh", padding: 20 }}>
        <SetupScreen
          signedInEmail={signedInEmail}
          onSignIn={signIn}
          busy={setupBusy}
          resultFileId={setupResultFileId}
          err={setupErr}
          onCreate={async () => {
            setSetupBusy(true); setSetupErr("");
            try {
              const seed = seedData();
              seed.roles.masterEmail = signedInEmail;
              const created = await driveCreateFile(accessToken, "family-tree-data.json", seed);
              await drivePublicShare(created.id, accessToken);
              setSetupResultFileId(created.id);
            } catch (e) { setSetupErr(e.message); }
            finally { setSetupBusy(false); }
          }}
        />
      </div>
    );
  }

  if (loading) return <div style={{ padding: 40, textAlign: "center", color: "var(--muted)" }}>載入家族資料中…</div>;
  if (loadErr && !persons) return <div style={{ padding: 40, textAlign: "center", color: "var(--seal)" }}>{loadErr}</div>;
  if (!persons) return null;

  return (
    <div style={{ minHeight: "100vh", padding: "18px 14px 60px" }}>
      <header style={{ maxWidth: 980, margin: "0 auto 18px" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          <h1 style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 900, margin: 0, letterSpacing: 2 }}>家族樹狀圖</h1>
          <span style={{ fontSize: 12, color: "var(--muted)" }}>族譜線上維護與展示</span>
        </div>
        <div style={{ marginTop: 10 }}>
          <AuthPanel
            roles={roles} session={session} signedInEmail={signedInEmail}
            onSignIn={signIn} onSignOut={signOut}
            onClaimMaster={handleClaimMaster}
            onManage={() => setShowManage(true)}
          />
        </div>
        {loadErr && <div style={{ color: "var(--seal)", fontSize: 12, marginTop: 6 }}>{loadErr}</div>}
      </header>

      <div style={{ maxWidth: 980, margin: "0 auto 18px", display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", borderTop: "1px solid var(--gold)", borderBottom: "1px solid var(--gold)", padding: "10px 0" }}>
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => setViewMode("tree")} style={{ ...miniBtnStyle, background: viewMode === "tree" ? "var(--seal)" : "transparent", color: viewMode === "tree" ? "var(--paper)" : "var(--ink)" }}>樹狀圖</button>
          <button onClick={() => setViewMode("list")} style={{ ...miniBtnStyle, background: viewMode === "list" ? "var(--seal)" : "transparent", color: viewMode === "list" ? "var(--paper)" : "var(--ink)" }}>世代清單</button>
        </div>
        {viewMode === "tree" && (
          <div style={{ display: "flex", gap: 4 }}>
            <button onClick={expandAll} style={miniBtnStyle}>展開全部</button>
            <button onClick={collapseAll} style={miniBtnStyle}>收合全部</button>
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 6, flex: 1, minWidth: 160 }}>
          <input style={{ ...inputStyle, maxWidth: 220 }} placeholder="搜尋姓名…" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
      </div>

      <main style={{ maxWidth: 980, margin: "0 auto" }}>
        {viewMode === "tree" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 30 }}>
            {rootsByEra.map((root) => (
              <div key={root.id}>
                <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8, fontFamily: "var(--font-display)" }}>{root.generationEra}</div>
                <div style={{ overflowX: "auto", paddingBottom: 8 }}>
                  <TreeNode id={root.id} persons={persons} collapsed={collapsed} toggle={toggleTreeNode} onEdit={openEdit} onAddChild={openAddChild} onAddSpouse={openAddSpouse} onAddParent={openAddParent} rootIdsSet={rootIdsSet} canEditFn={canEditPerson} highlight={search.trim()} />
                </div>
              </div>
            ))}
          </div>
        )}
        {viewMode === "list" && (
          <div>
            {rootsByEra.map((root) => (
              <div key={root.id} style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4, fontFamily: "var(--font-display)" }}>{root.generationEra}</div>
                <ListNode id={root.id} persons={persons} depth={0} expanded={expanded} toggle={toggleListNode} onEdit={openEdit} onAddChild={openAddChild} onAddSpouse={openAddSpouse} onAddParent={openAddParent} rootIdsSet={rootIdsSet} canEditFn={canEditPerson} highlight={search.trim()} />
              </div>
            ))}
          </div>
        )}
      </main>

      {formState && formState.mode === "parent" && (
        <AddParentForm
          otherRoots={rootIds.filter((id) => id !== formState.personId).map((id) => persons[id]).filter(Boolean)}
          onCancel={() => setFormState(null)}
          onCreateNew={handleCreateNewAncestor}
          onAttachExisting={handleAttachExistingAncestor}
        />
      )}
      {formState && formState.mode !== "parent" && (
        <PersonForm mode={formState.mode} initial={formState.initial || persons[formState.personId]} onCancel={() => setFormState(null)} onSave={handleSaveForm} onDelete={formState.mode === "edit" ? handleDeletePerson : null} allPersons={persons} personId={formState.personId} />
      )}
      {showManage && roles && (
        <ManagePanel roles={roles} persons={persons} fileId={CONFIG.FILE_ID} accessToken={accessToken} onClose={() => setShowManage(false)} onAddRole={handleAddRole} onRemoveRole={handleRemoveRole} />
      )}

      <footer style={{ maxWidth: 980, margin: "30px auto 0", fontSize: 11, color: "var(--muted)", textAlign: "center" }}>
        資料存放於 Google Drive；訪客可直接瀏覽（唯讀），登入 Google 帳號並取得授權後可依角色編輯。
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<script>
  // 手動轉譯上方原始碼，強制使用「classic」JSX 轉換模式（React.createElement），
  // 避免新版 Babel 預設的「automatic」模式插入 import 陳述式，
  // 因為這段程式碼是在瀏覽器裡以純 <script> 執行，並非模組（module），不支援 import。
  (function () {
    var source = document.getElementById("app-source").textContent;
    try {
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var script = document.createElement("script");
      script.textContent = output;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;color:#9B2E23;font-family:sans-serif;">程式碼編譯失敗：' +
        (e && e.message ? e.message : String(e)) +
        "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
