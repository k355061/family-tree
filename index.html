/* ===========================================================
   Google Drive 讀寫（REST API，透過 fetch）
=========================================================== */
async function driveReadPublic(fileId) {
  // 訪客讀取：不需登入，用 API Key 讀取「連結任何人可檢視」的檔案
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${CONFIG.API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("讀取失敗 (" + res.status + ")");
  return await res.json();
}
async function driveReadAuthed(fileId, accessToken) {
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!res.ok) throw new Error("讀取失敗 (" + res.status + ")");
  return await res.json();
}
async function driveWrite(fileId, accessToken, dataObj) {
  const url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
  const res = await fetch(url, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(dataObj),
  });
  if (!res.ok) throw new Error("寫入失敗 (" + res.status + ")");
  return await res.json();
}
async function driveCreateFile(accessToken, name, dataObj) {
  const boundary = "-------familytree" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dataObj)}\r\n--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error("建立檔案失敗 (" + res.status + ")");
  return await res.json(); // { id, ... }
}
async function drivePublicShare(fileId, accessToken) {
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ role: "reader", type: "anyone" }),
  });
}
async function driveShareEditor(fileId, accessToken, email) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ role: "writer", type: "user", emailAddress: email }),
  });
  if (!res.ok) throw new Error("分享編輯權限失敗 (" + res.status + ")，請確認你自己是否有分享權限");
  return await res.json();
}

/* ===========================================================
   權限工具
=========================================================== */
function getDescendantIds(persons, rootId) {
  const out = new Set([rootId]);
  const stack = [rootId];
  while (stack.length) {
    const cur = stack.pop();
    Object.values(persons).forEach((p) => {
      if (p.parentId === cur && !out.has(p.id)) { out.add(p.id); stack.push(p.id); }
    });
  }
  Object.values(persons).forEach((p) => { if (out.has(p.id)) (p.spouseIds || []).forEach((sid) => out.add(sid)); });
  return out;
}
function computeDefaultCollapsed(persons, rootIds) {
  // 預設只展開到孫子輩（depth 0=公, 1=子女, 2=孫），depth>=2 的節點如果有子女就先收合，
  // 避免某一房資料筆數變多時，樹狀圖一開始就撐得太寬、把同輩的其他人擠出視野。
  const out = new Set();
  const visit = (id, depth) => {
    const children = Object.values(persons).filter((c) => c.parentId === id);
    if (depth >= 2 && children.length > 0) out.add(id);
    children.forEach((c) => visit(c.id, depth + 1));
  };
  rootIds.forEach((rid) => visit(rid, 0));
  return out;
}
/* ===========================================================
   匯出 / 匯入 工具函式
=========================================================== */
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportToJSONString(persons, rootIds, roles) {
  return JSON.stringify({ persons, rootIds, roles, exportedAt: new Date().toISOString(), exportVersion: 1 }, null, 2);
}

function personBirthLineMd(p) {
  const parts = [p.birthEra, p.birthLunar, p.birthHour].filter(Boolean).join(" ");
  if (p.birthAdYear) return `${parts ? parts + " " : ""}(${p.birthAdYear}年)`;
  return parts || "生辰未詳";
}

function personToMarkdown(id, persons, depth) {
  const p = persons[id];
  if (!p) return "";
  const indent = "  ".repeat(depth);
  const children = Object.values(persons).filter((c) => c.parentId === id).sort((a, b) => a.childOrder - b.childOrder);
  const spouses = (p.spouseIds || []).map((sid) => persons[sid]).filter(Boolean);
  let out = `${indent}- **${p.name}**\n`;
  out += `${indent}  - 出生日期：${personBirthLineMd(p)}\n`;
  if (p.deathNote) out += `${indent}  - 卒亡／享壽：${p.deathNote}\n`;
  if (p.note) out += `${indent}  - 備註：${p.note}\n`;
  if (spouses.length > 0) {
    out += `${indent}  - 配偶：\n`;
    spouses.forEach((s) => {
      out += `${indent}    - **${s.name}**（${s.spouseType || "配偶"}）\n`;
      out += `${indent}      - 出生日期：${personBirthLineMd(s)}\n`;
      if (s.deathNote) out += `${indent}      - 卒亡／享壽：${s.deathNote}\n`;
    });
  }
  if (children.length > 0) {
    out += `${indent}  - 子女：\n`;
    children.forEach((c) => { out += personToMarkdown(c.id, persons, depth + 2); });
  }
  return out;
}

function exportToMarkdown(persons, rootIds) {
  const roots = rootIds.map((id) => persons[id]).filter(Boolean).sort((a, b) => (a.birthAdYear || 0) - (b.birthAdYear || 0));
  let md = `# 家族樹狀圖\n\n匯出時間：${new Date().toLocaleString("zh-TW")}\n\n`;
  roots.forEach((root) => {
    if (root.generationEra) md += `## ${root.generationEra}\n\n`;
    md += personToMarkdown(root.id, persons, 0) + "\n";
  });
  return md;
}

/* 把匯入的資料（不論來源 JSON 或 GEDCOM 轉換後）與現有資料合併，
   重新產生所有 ID 避免與現有資料撞號，匯入的頂層祖先會成為新的頂層根節點，
   之後可用「編輯 → 上層（父親）」把它們掛到現有家族樹的正確位置。 */
function mergeImportedPersons(currentPersons, currentRootIds, importedPersons, importedRootIds) {
  const idMap = {};
  Object.keys(importedPersons).forEach((oldId) => { idMap[oldId] = uid(); });
  const remapped = {};
  Object.values(importedPersons).forEach((p) => {
    remapped[idMap[p.id]] = {
      ...p,
      id: idMap[p.id],
      parentId: p.parentId ? (idMap[p.parentId] || null) : null,
      spouseIds: (p.spouseIds || []).map((sid) => idMap[sid]).filter(Boolean),
      spouseOf: p.spouseOf ? (idMap[p.spouseOf] || null) : undefined,
    };
  });
  const newRootIds = importedRootIds.map((id) => idMap[id]).filter(Boolean);
  return {
    mergedPersons: { ...currentPersons, ...remapped },
    mergedRootIds: [...currentRootIds, ...newRootIds],
    importedCount: Object.keys(remapped).length,
  };
}

/* ===========================================================
   GEDCOM 匯入解析（支援常見核心欄位：NAME, SEX, BIRT/DATE, DEAT,
   FAMC/FAMS, HUSB/WIFE/CHIL；不支援的欄位會被忽略）
=========================================================== */
function parseGedcomDateToYear(str) {
  if (!str) return null;
  const m = String(str).match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
  return m ? Number(m[0]) : null;
}

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const records = []; // { level, xref, tag, value }
  lines.forEach((line) => {
    const m = line.match(/^(\d+)\s+(?:@([^@]+)@\s+)?(\S+)(?:\s+(.*))?$/);
    if (!m) return;
    records.push({ level: Number(m[1]), xref: m[2] || null, tag: m[3], value: m[4] || "" });
  });

  const indis = {}; // xref -> { name, sex, birtYear, deatNote, famc, fams:[] }
  const fams = {};  // xref -> { husb, wife, chil:[] }

  let i = 0;
  while (i < records.length) {
    const rec = records[i];
    if (rec.level === 0 && rec.xref && rec.tag === "INDI") {
      const person = { xref: rec.xref, name: "", sex: "M", birtYear: null, birtDetail: "", deatNote: "", famc: null, fams: [] };
      i++;
      while (i < records.length && records[i].level > 0) {
        const r = records[i];
        if (r.level === 1 && r.tag === "NAME") {
          person.name = r.value.replace(/\//g, "").trim();
        } else if (r.level === 1 && r.tag === "SEX") {
          person.sex = r.value.trim().toUpperCase() === "F" ? "F" : "M";
        } else if (r.level === 1 && r.tag === "BIRT") {
          let j = i + 1;
          while (j < records.length && records[j].level > 1) {
            if (records[j].tag === "DATE") { person.birtYear = parseGedcomDateToYear(records[j].value); person.birtDetail = records[j].value; }
            j++;
          }
        } else if (r.level === 1 && r.tag === "DEAT") {
          let j = i + 1;
          while (j < records.length && records[j].level > 1) {
            if (records[j].tag === "DATE") person.deatNote = "卒：" + records[j].value;
            j++;
          }
        } else if (r.level === 1 && r.tag === "FAMC") {
          person.famc = (r.value.match(/@([^@]+)@/) || [])[1] || r.value.replace(/@/g, "");
        } else if (r.level === 1 && r.tag === "FAMS") {
          person.fams.push((r.value.match(/@([^@]+)@/) || [])[1] || r.value.replace(/@/g, ""));
        }
        i++;
      }
      indis[rec.xref] = person;
    } else if (rec.level === 0 && rec.xref && rec.tag === "FAM") {
      const fam = { xref: rec.xref, husb: null, wife: null, chil: [] };
      i++;
      while (i < records.length && records[i].level > 0) {
        const r = records[i];
        if (r.level === 1 && r.tag === "HUSB") fam.husb = (r.value.match(/@([^@]+)@/) || [])[1] || r.value.replace(/@/g, "");
        else if (r.level === 1 && r.tag === "WIFE") fam.wife = (r.value.match(/@([^@]+)@/) || [])[1] || r.value.replace(/@/g, "");
        else if (r.level === 1 && r.tag === "CHIL") fam.chil.push((r.value.match(/@([^@]+)@/) || [])[1] || r.value.replace(/@/g, ""));
        i++;
      }
      fams[rec.xref] = fam;
    } else {
      i++;
    }
  }

  // 決定每個家庭的「血緣主幹」：優先選有 FAMC（表示還能往上追溯祖先）的一方為主幹，另一方當配偶
  const persons = {};
  const xrefToPersonId = {};
  let simplifiedCount = 0;

  function ensurePerson(xref) {
    if (xrefToPersonId[xref]) return xrefToPersonId[xref];
    const ind = indis[xref];
    if (!ind) return null;
    const pid = uid();
    xrefToPersonId[xref] = pid;
    persons[pid] = {
      id: pid, name: ind.name || "未命名", gender: ind.sex === "F" ? "F" : "M",
      parentId: null, childOrder: 0,
      birthAdYear: ind.birtYear || null, birthEra: "", birthLunar: ind.birtDetail && !ind.birtYear ? ind.birtDetail : "", birthHour: "",
      deathNote: ind.deatNote || "", note: "", spouseIds: [],
    };
    return pid;
  }

  Object.values(fams).forEach((fam) => {
    const husbXref = fam.husb, wifeXref = fam.wife;
    const husbHasFamc = husbXref && indis[husbXref] && indis[husbXref].famc;
    const wifeHasFamc = wifeXref && indis[wifeXref] && indis[wifeXref].famc;
    let spineXref = null, spouseXref = null;
    if (husbXref && wifeXref) {
      if (wifeHasFamc && !husbHasFamc) { spineXref = wifeXref; spouseXref = husbXref; }
      else { spineXref = husbXref; spouseXref = wifeXref; } // 預設父方為主幹
      if (wifeHasFamc && husbHasFamc) simplifiedCount++; // 雙邊都可追溯，只能保留一邊
    } else {
      spineXref = husbXref || wifeXref;
    }
    const spinePid = spineXref ? ensurePerson(spineXref) : null;
    const spousePid = spouseXref ? ensurePerson(spouseXref) : null;
    if (spinePid && spousePid) {
      persons[spousePid].parentId = null;
      persons[spousePid].spouseOf = spinePid;
      persons[spousePid].spouseType = "配偶";
      persons[spinePid].spouseIds.push(spousePid);
      persons[spousePid].spouseIds.push(spinePid);
    }
    fam.chil.forEach((cx) => {
      const cid = ensurePerson(cx);
      if (cid && spinePid) persons[cid].parentId = spinePid;
    });
  });
  // 沒有被任何家庭關係涵蓋到的個人（孤立節點）也要建立
  Object.keys(indis).forEach((xref) => ensurePerson(xref));

  // childOrder：依出生年份排序同一父親底下的子女
  const byParent = {};
  Object.values(persons).forEach((p) => { if (p.parentId) { (byParent[p.parentId] = byParent[p.parentId] || []).push(p); } });
  Object.values(byParent).forEach((list) => {
    list.sort((a, b) => (a.birthAdYear || 9999) - (b.birthAdYear || 9999));
    list.forEach((p, idx) => { p.childOrder = idx; });
  });

  const rootIds = Object.values(persons).filter((p) => !p.parentId && !p.spouseOf).map((p) => p.id);
  return { persons, rootIds, totalCount: Object.keys(persons).length, simplifiedCount };
}

function buildRadialLayout(persons, rootId, minRingGap) {
  minRingGap = minRingGap || 78;
  const minArcPerNode = 34; // 同一圈相鄰節點間至少保留的弧長（像素）

  const childrenOf = {};
  Object.values(persons).forEach((p) => {
    if (p.parentId) (childrenOf[p.parentId] = childrenOf[p.parentId] || []).push(p);
  });
  Object.values(childrenOf).forEach((list) => list.sort((a, b) => a.childOrder - b.childOrder));

  const leafCountCache = {};
  function leafCount(id) {
    if (leafCountCache[id] !== undefined) return leafCountCache[id];
    const kids = childrenOf[id] || [];
    const count = kids.length === 0 ? 1 : kids.reduce((sum, c) => sum + leafCount(c.id), 0);
    leafCountCache[id] = count;
    return count;
  }
  leafCount(rootId);

  // 第一階段：純粹依權重（子孫數量開根號，緩和差距）分配每個人的角度範圍，此階段不需要知道半徑
  const angleOf = {};
  function assignAngles(id, depth, angleStart, angleEnd) {
    angleOf[id] = { start: angleStart, end: angleEnd, depth };
    const kids = childrenOf[id] || [];
    if (kids.length > 0) {
      const weight = (cid) => Math.sqrt(leafCount(cid));
      const totalWeight = kids.reduce((sum, c) => sum + weight(c.id), 0);
      let cursor = angleStart;
      kids.forEach((c) => {
        const share = (weight(c.id) / totalWeight) * (angleEnd - angleStart);
        assignAngles(c.id, depth + 1, cursor, cursor + share);
        cursor += share;
      });
    }
  }
  assignAngles(rootId, 0, 0, 360);

  // 第二階段：找出每一圈裡「角度分配最窄」的節點，反推該圈至少要多大半徑才能維持最小間距
  const maxDepth = Math.max(0, ...Object.values(angleOf).map((a) => a.depth));
  const ringRadius = { 0: 0 };
  for (let d = 1; d <= maxDepth; d++) {
    let minWidthDeg = Infinity;
    Object.values(angleOf).forEach((a) => { if (a.depth === d) minWidthDeg = Math.min(minWidthDeg, a.end - a.start); });
    if (!isFinite(minWidthDeg) || minWidthDeg <= 0) minWidthDeg = 360;
    const minWidthRad = (minWidthDeg * Math.PI) / 180;
    const requiredByAngle = minArcPerNode / Math.max(minWidthRad, 0.001);
    ringRadius[d] = Math.max(ringRadius[d - 1] + minRingGap, requiredByAngle);
  }

  // 第三階段：依角度中點與該圈半徑計算最終座標
  const nodes = [];
  const edgeRefs = [];
  Object.keys(angleOf).forEach((id) => {
    const p = persons[id];
    if (!p) return;
    const { start, end, depth } = angleOf[id];
    const angle = (start + end) / 2;
    const r = ringRadius[depth] || 0;
    const rad = ((angle - 90) * Math.PI) / 180;
    const x = r * Math.cos(rad);
    const y = r * Math.sin(rad);
    const spouseNames = (p.spouseIds || []).map((sid) => persons[sid]).filter(Boolean).map((s) => s.name);
    nodes.push({ id, name: p.name, gender: p.gender, x, y, ring: depth, spouseNames });
    (childrenOf[id] || []).forEach((c) => edgeRefs.push({ parentId: id, childId: c.id }));
  });
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const edges = edgeRefs.map((e) => ({ x1: byId[e.parentId].x, y1: byId[e.parentId].y, x2: byId[e.childId].x, y2: byId[e.childId].y }));
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  nodes.forEach((n) => {
    minX = Math.min(minX, n.x - 45); maxX = Math.max(maxX, n.x + 45);
    minY = Math.min(minY, n.y - 20); maxY = Math.max(maxY, n.y + 40);
  });
  const pad = 30;
  const offsetX = -minX + pad, offsetY = -minY + pad;
  nodes.forEach((n) => { n.x += offsetX; n.y += offsetY; });
  edges.forEach((e) => { e.x1 += offsetX; e.y1 += offsetY; e.x2 += offsetX; e.y2 += offsetY; });
  return { nodes, edges, width: maxX - minX + pad * 2, height: maxY - minY + pad * 2 };
}
function computeGenerationMap(persons, rootIds) {
  const map = {};
  function walk(id, gen) {
    if (gen != null) map[id] = gen;
    const p = persons[id];
    const children = Object.values(persons).filter((c) => c.parentId === id);
    // 代數只透過男性往下傳遞：女兒本身仍算有代數，但她出嫁後所生子女屬於別姓氏，
    // 不再自動繼承本家代數（僅在族譜上留下有子女的紀錄）。
    const propagate = gen != null && p && p.gender !== "F";
    children.forEach((c) => walk(c.id, propagate ? gen + 1 : null));
  }
  rootIds.forEach((rid) => {
    const root = persons[rid];
    const startGen = root && root.startGeneration ? Number(root.startGeneration) : null;
    walk(rid, startGen);
  });
  // 配偶跟另一半算同一代
  Object.values(persons).forEach((p) => {
    if (map[p.id] != null) {
      (p.spouseIds || []).forEach((sid) => { if (map[sid] == null) map[sid] = map[p.id]; });
    }
  });
  return map;
}
function getAncestorChain(persons, id) {
  const chain = [];
  let cur = persons[id];
  while (cur && cur.parentId) {
    chain.push(cur.parentId);
    cur = persons[cur.parentId];
  }
  return chain;
}
function roleLabel(role) {
  if (role === "master") return "主管理者";
  if (role === "sub") return "副管理者";
  if (role && role.startsWith("node:")) return "節點管理者";
  return "訪客（唯讀）";
}

        {spouses.length > 0 && (

              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 4 }}>

function TreeNode({ id, persons, collapsed, toggle, compact, ...actions }) {
  const p = persons[id];
  if (!p) return null;
  const children = Object.values(persons).filter((c) => c.parentId === id).sort((a, b) => a.childOrder - b.childOrder);
  const isCollapsed = collapsed.has(id);
  const childrenCompact = children.length >= 6;
  const gap = childrenCompact ? 10 : 28;
  return (
    <div data-person-id={id} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        {children.length > 0 && <button onClick={() => toggle(id)} style={{ ...iconBtnStyle, color: "var(--gold)" }}>{isCollapsed ? "▶" : "▼"}</button>}
        <PersonCard p={p} persons={persons} compact={compact} {...actions} />
      </div>
      {!isCollapsed && children.length > 0 && (
        <div style={{ position: "relative", marginTop: 18, paddingTop: 18, borderTop: "2px solid var(--gold)" }}>
          <div style={{ display: "flex", gap }}>
            {children.map((c) => (
              <div key={c.id} style={{ position: "relative" }}>
                <div style={{ position: "absolute", top: -18, left: "50%", width: 2, height: 18, background: "var(--gold)" }} />
                <TreeNode id={c.id} persons={persons} collapsed={collapsed} toggle={toggle} compact={childrenCompact} {...actions} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
function ListNode({ id, persons, depth, expanded, toggle, ...actions }) {
  const p = persons[id];
  if (!p) return null;
  const children = Object.values(persons).filter((c) => c.parentId === id).sort((a, b) => a.childOrder - b.childOrder);
  const isOpen = expanded.has(id);
  return (
    <div style={{ marginLeft: depth === 0 ? 0 : 20, marginTop: 10 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
        {children.length > 0 ? <button onClick={() => toggle(id)} style={{ ...iconBtnStyle, marginTop: 10, color: "var(--gold)" }}>{isOpen ? "▼" : "▶"}</button> : <span style={{ width: 18 }} />}
        <PersonCard p={p} persons={persons} {...actions} />

      {isOpen && children.length > 0 && (
        <div style={{ borderLeft: "2px dotted var(--gold)", marginLeft: 9, paddingLeft: 10 }}>

}

function RadialTree({ id, persons, highlight, generationMap }) {
  const layout = useMemo(() => buildRadialLayout(persons, id), [persons, id]);
  return (
    <svg width={layout.width} height={layout.height} style={{ display: "block" }}>
      {layout.edges.map((e, i) => (
        <line key={i} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="var(--gold)" strokeWidth="1" />
      ))}
      {layout.nodes.map((n) => {
        const isHit = highlight && n.name.includes(highlight);
        const color = n.gender === "F" ? "var(--jade)" : "var(--seal)";
        const rr = Math.max(6, 17 - n.ring * 1.6);
        const gen = generationMap ? generationMap[n.id] : null;
        return (
          <g key={n.id} data-person-id={n.id}>
            <circle cx={n.x} cy={n.y} r={rr} fill={color} fillOpacity={isHit ? 1 : 0.85} stroke={isHit ? "var(--ink)" : "none"} strokeWidth={isHit ? 2 : 0} />
            <text x={n.x} y={n.y + rr + 13} textAnchor="middle" fontSize={Math.max(9, 13 - n.ring)} fill="var(--ink)" fontFamily="var(--font-display)" fontWeight="700">
              {gen != null ? `${n.name}（${gen}）` : n.name}
            </text>
            {n.spouseNames.length > 0 && (
              <text x={n.x} y={n.y + rr + 25} textAnchor="middle" fontSize={Math.max(8, 10 - n.ring)} fill="var(--jade)">{n.spouseNames.join("、")}</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

function ImportExportPanel({ persons, rootIds, roles, canImport, onClose, onImportData }) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const jsonFileRef = useRef(null);
  const gedcomFileRef = useRef(null);

  const handleExportJSON = () => {
    downloadFile("family-tree-export.json", exportToJSONString(persons, rootIds, roles), "application/json");
  };
  const handleExportMD = () => {
    downloadFile("family-tree-export.md", exportToMarkdown(persons, rootIds), "text/markdown");
  };

  const handleImportJSONFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true); setErr(""); setMsg("");
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.persons || !data.rootIds) throw new Error("檔案格式不正確，缺少 persons 或 rootIds");
      const { mergedPersons, mergedRootIds, importedCount } = mergeImportedPersons(persons, rootIds, data.persons, data.rootIds);
      await onImportData(mergedPersons, mergedRootIds);
      setMsg(`匯入完成，共加入 ${importedCount} 筆人物資料。新匯入的頂層祖先請到「編輯 → 上層（父親）」設定掛到正確位置。`);
    } catch (ex) {
      setErr("匯入失敗：" + ex.message);
    } finally {
      setBusy(false);
      if (jsonFileRef.current) jsonFileRef.current.value = "";
    }
  };

  const handleImportGedcomFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true); setErr(""); setMsg("");
    try {
      const text = await file.text();
      const parsed = parseGedcom(text);
      if (parsed.totalCount === 0) throw new Error("沒有解析到任何人物，請確認檔案是否為標準 GEDCOM 格式");
      const { mergedPersons, mergedRootIds, importedCount } = mergeImportedPersons(persons, rootIds, parsed.persons, parsed.rootIds);
      await onImportData(mergedPersons, mergedRootIds);
      let m = `匯入完成，共加入 ${importedCount} 筆人物資料。`;
      if (parsed.simplifiedCount > 0) m += `其中有 ${parsed.simplifiedCount} 段婚姻雙方原本都有各自的祖先紀錄，因為我們的系統僅支援單一血緣主幹，已簡化保留其中一方的祖先線（另一方僅保留為配偶）。`;
      m += " 新匯入的頂層祖先請到「編輯 → 上層（父親）」設定掛到正確位置。";
      setMsg(m);
    } catch (ex) {
      setErr("匯入失敗：" + ex.message);
    } finally {
      setBusy(false);
      if (gedcomFileRef.current) gedcomFileRef.current.value = "";
    }
  };

  return (
    <div style={overlayStyle}>
      <div style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <h3 style={{ fontFamily: "var(--font-display)", fontSize: 18, margin: 0 }}>匯入／匯出</h3>
          <button onClick={onClose} style={iconBtnStyle}>✕</button>
        </div>

        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>匯出</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
          <button onClick={handleExportJSON} style={miniBtnStyle}>匯出 JSON（備份／給別人匯入用）</button>
          <button onClick={handleExportMD} style={miniBtnStyle}>匯出 Markdown（可讀版本）</button>
        </div>

        {canImport ? (
          <React.Fragment>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>匯入（會合併進現有家族樹，成為新的頂層祖先）</div>
            <div style={{ marginBottom: 10 }}>
              <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>匯入本系統匯出的 JSON 檔</label>
              <input ref={jsonFileRef} type="file" accept=".json,application/json" onChange={handleImportJSONFile} disabled={busy} />
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>匯入 GEDCOM 檔（.ged，家譜軟體匯出的通用格式）</label>
              <input ref={gedcomFileRef} type="file" accept=".ged,.gedcom,text/plain" onChange={handleImportGedcomFile} disabled={busy} />
            </div>
            {busy && <div style={{ fontSize: 12, color: "var(--muted)" }}>處理中…</div>}
            {msg && <div style={{ fontSize: 12, color: "var(--jade)", marginTop: 6 }}>{msg}</div>}
            {err && <div style={{ fontSize: 12, color: "var(--seal)", marginTop: 6 }}>{err}</div>}
            <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 12 }}>
              提醒：GEDCOM 匯入僅支援常見的核心欄位（姓名、性別、出生／死亡日期、婚姻與親子關係），
              不支援附件、來源引註等進階內容；若一段婚姻雙方都各自有完整祖先紀錄，只會保留一方作為血緣主幹。
            </div>
          </React.Fragment>
        ) : (
          <div style={{ fontSize: 12, color: "var(--muted)" }}>匯入功能僅開放給主管理者／副管理者使用。</div>
        )}
      </div>
    </div>
  );
}

function ManagePanel({ roles, persons, fileId, accessToken, onClose, onAddRole, onRemoveRole }) {

  const [role, setRole] = useState("sub");
  const [nodeId, setNodeId] = useState("");

  const handleAdd = async () => {
    if (!email || (role === "node" && !nodeId)) return;
    setBusy(true); setErr("");
    try {
      await driveShareEditor(fileId, accessToken, email); // 真正的 Drive 編輯權限
      await onAddRole({ email, role, nodeId: role === "node" ? nodeId : null });
      setEmail(""); setNodeId("");

      setErr(e.message);
    } finally { setBusy(false); }

          </select>
        </FormRow>
        {role === "node" && (

        </button>

        <div style={{ fontSize: 13, fontWeight: 700, marginTop: 16, marginBottom: 4 }}>目前管理者名單</div>
        {(roles.admins || []).map((a, i) => (

   主程式
=========================================================== */
function App() {
  const [persons, setPersons] = useState(null);
  const [rootIds, setRootIds] = useState([]);
  const [roles, setRoles] = useState(null);
  const [signedInEmail, setSignedInEmail] = useState(null);
  const [accessToken, setAccessToken] = useState(null);
  const [session, setSession] = useState(null); // { role }
  const [viewMode, setViewMode] = useState("tree");
  const [presentMode, setPresentMode] = useState(false);
  const [zoom, setZoom] = useState({ scale: 1, x: 20, y: 20 });
  const [search, setSearch] = useState("");
  const [collapsed, setCollapsed] = useState(new Set());
  const [expanded, setExpanded] = useState(new Set());
  const [formState, setFormState] = useState(null);
  const [showManage, setShowManage] = useState(false);
  const [showImportExport, setShowImportExport] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState("");
  const tokenClientRef = useRef(null);
  const canvasViewportRef = useRef(null);
  const canvasContentRef = useRef(null);

  const [setupBusy, setSetupBusy] = useState(false);
  const [setupResultFileId, setSetupResultFileId] = useState("");
  const [setupErr, setSetupErr] = useState("");

  const needsSetup = !CONFIG.FILE_ID;

  // 初始化 Google Identity Services token client
  useEffect(() => {
    const wait = setInterval(() => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: CONFIG.CLIENT_ID,
          scope: CONFIG.SCOPES,
          callback: async (resp) => {
            if (resp.error) { setLoadErr("登入失敗：" + resp.error); return; }
            setAccessToken(resp.access_token);
            try {
              const info = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                headers: { Authorization: `Bearer ${resp.access_token}` },
              }).then((r) => r.json());
              setSignedInEmail(info.email);
            } catch (e) { setLoadErr("取得帳號資訊失敗"); }
          },
        });
        clearInterval(wait);
      }
    }, 200);
    return () => clearInterval(wait);
  }, []);

  const signIn = () => tokenClientRef.current && tokenClientRef.current.requestAccessToken();
  const signOut = () => { setAccessToken(null); setSignedInEmail(null); setSession(null); };

  // 讀取資料（有 FILE_ID 才讀）
  useEffect(() => {
    if (needsSetup) { setLoading(false); return; }
    (async () => {
      try {
        const data = accessToken
          ? await driveReadAuthed(CONFIG.FILE_ID, accessToken)
          : await driveReadPublic(CONFIG.FILE_ID);
        const safePersons = data && data.persons ? data.persons : {};
        const safeRootIds = data && data.rootIds ? data.rootIds : [];
        setPersons(safePersons);
        setRootIds(safeRootIds);
        setRoles((data && data.roles) || { masterEmail: null, admins: [], nodeAdmins: [] });
        setCollapsed(computeDefaultCollapsed(safePersons, safeRootIds));
      } catch (e) {
        setLoadErr("讀取家族資料失敗：" + e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, [needsSetup, accessToken]);

  // 根據登入 email + roles 決定 session 角色
  useEffect(() => {
    if (!signedInEmail || !roles) { setSession(null); return; }
    if (roles.masterEmail === signedInEmail) { setSession({ role: "master" }); return; }
    if ((roles.admins || []).some((a) => a.email === signedInEmail)) { setSession({ role: "sub" }); return; }
    const node = (roles.nodeAdmins || []).find((a) => a.email === signedInEmail);
    if (node) { setSession({ role: "node:" + node.nodeId }); return; }
    setSession(null);
  }, [signedInEmail, roles]);

  const persistAll = useCallback(async (newPersons, newRootIds, newRoles) => {
    const finalPersons = newPersons || persons;
    const finalRootIds = newRootIds || rootIds;
    const finalRoles = newRoles || roles;
    setPersons(finalPersons); setRootIds(finalRootIds); setRoles(finalRoles);
    if (!accessToken) { setLoadErr("尚未登入，無法儲存"); return; }
    try {
      await driveWrite(CONFIG.FILE_ID, accessToken, { persons: finalPersons, rootIds: finalRootIds, roles: finalRoles });
    } catch (e) {
      setLoadErr("儲存失敗：" + e.message);
    }
  }, [persons, rootIds, roles, accessToken]);

  const canEditPerson = useCallback((personId) => {
    if (!session) return false;
    if (session.role === "master" || session.role === "sub") return true;
    if (session.role.startsWith("node:")) {
      const nodeId = session.role.slice(5);
      if (!persons) return false;
      return getDescendantIds(persons, nodeId).has(personId);
    }
    return false;
  }, [session, persons]);

  const handleClaimMaster = async () => {
    const newRoles = { masterEmail: signedInEmail, admins: [], nodeAdmins: [] };
    await persistAll(null, null, newRoles);
  };
  const handleAddRole = async ({ email, role, nodeId }) => {
    const newRoles = { ...roles };
    if (role === "sub") newRoles.admins = [...(roles.admins || []), { email }];
    else newRoles.nodeAdmins = [...(roles.nodeAdmins || []), { email, nodeId }];
    await persistAll(null, null, newRoles);
  };
  const handleRemoveRole = async (kind, idx) => {
    const newRoles = { ...roles };
    if (kind === "sub") newRoles.admins = roles.admins.filter((_, i) => i !== idx);
    else newRoles.nodeAdmins = roles.nodeAdmins.filter((_, i) => i !== idx);
    await persistAll(null, null, newRoles);
  };

  const openEdit = (personId) => setFormState({ mode: "edit", personId });
  const openAddSpouse = (personId) => setFormState({ mode: "spouse", personId, initial: { name: "", gender: "F", birthAdYear: null, birthEra: "", birthLunar: "", birthHour: "", deathNote: "", note: "", spouseType: "配偶" } });
  const openAddChild = (personId) => setFormState({ mode: "child", personId, initial: { name: "", gender: "M", birthAdYear: null, birthEra: "", birthLunar: "", birthHour: "", deathNote: "", note: "" } });
  const openAddParent = (personId) => setFormState({ mode: "parent", personId });

  const handleSaveForm = async (f) => {
    const newPersons = { ...persons };
    let newRootIds = rootIds;
    if (formState.mode === "edit") {
      const oldParentId = persons[formState.personId].parentId || null;
      const newParentId = f.parentId || null;
      newPersons[formState.personId] = { ...newPersons[formState.personId], ...f, parentId: newParentId };
      if (newParentId !== oldParentId) {
        const isCurrentlyRoot = rootIds.includes(formState.personId);
        if (newParentId === null && !isCurrentlyRoot) {
          newRootIds = [...rootIds, formState.personId];
        } else if (newParentId !== null && isCurrentlyRoot) {
          newRootIds = rootIds.filter((id) => id !== formState.personId);
        }
      }
    } else if (formState.mode === "spouse") {
      const spouseId = uid();
      newPersons[spouseId] = { id: spouseId, name: f.name, gender: f.gender, parentId: null, childOrder: 0, birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour, deathNote: f.deathNote, note: f.note, spouseIds: [formState.personId], spouseType: f.spouseType, spouseOf: formState.personId };
      newPersons[formState.personId] = { ...newPersons[formState.personId], spouseIds: [...(newPersons[formState.personId].spouseIds || []), spouseId] };
    } else if (formState.mode === "child") {
      const childId = uid();
      const siblingCount = Object.values(persons).filter((p) => p.parentId === formState.personId).length;
      newPersons[childId] = { id: childId, name: f.name, gender: f.gender, parentId: formState.personId, childOrder: siblingCount, birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour, deathNote: f.deathNote, note: f.note, spouseIds: [] };
    }
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };
  const handleDeletePerson = async () => {
    const id = formState.personId;
    const hasChildren = Object.values(persons).some((p) => p.parentId === id);
    if (hasChildren) { alert("此人物尚有子女紀錄，請先處理子女節點後再刪除。"); return; }
    const newPersons = { ...persons };
    delete newPersons[id];
    Object.values(newPersons).forEach((p) => { if ((p.spouseIds || []).includes(id)) p.spouseIds = p.spouseIds.filter((s) => s !== id); });
    const newRootIds = rootIds.filter((r) => r !== id);
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  // 新增上一代：建立全新的祖先，原本這個根節點變成新祖先的子女
  const handleCreateNewAncestor = async (f) => {
    const currentRootId = formState.personId;
    const newAncestorId = uid();
    const newPersons = { ...persons };
    const childCurrentGen = generationMap[currentRootId]; // 目前這位若已有代數，新祖先自動往上推一代
    newPersons[newAncestorId] = {
      id: newAncestorId, name: f.name, gender: f.gender, parentId: null, childOrder: 0,
      birthAdYear: f.birthAdYear, birthEra: f.birthEra, birthLunar: f.birthLunar, birthHour: f.birthHour,
      deathNote: f.deathNote, note: f.note, spouseIds: [], generationEra: f.generationEra || "",
      startGeneration: childCurrentGen != null ? childCurrentGen - 1 : null,
    };
    newPersons[currentRootId] = { ...newPersons[currentRootId], parentId: newAncestorId, startGeneration: null };
    const newRootIds = rootIds.map((id) => (id === currentRootId ? newAncestorId : id));
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  // 新增上一代：歸到現有的另一位頂層祖先底下（例如兩房是兄弟，共用同一父親）
  const handleAttachExistingAncestor = async (existingAncestorId) => {
    const currentRootId = formState.personId;
    const newPersons = { ...persons };
    newPersons[currentRootId] = { ...newPersons[currentRootId], parentId: existingAncestorId, startGeneration: null };
    const newRootIds = rootIds.filter((id) => id !== currentRootId);
    await persistAll(newPersons, newRootIds, null);
    setFormState(null);
  };

  const handleImportData = async (mergedPersons, mergedRootIds) => {
    await persistAll(mergedPersons, mergedRootIds, null);
    setCollapsed(computeDefaultCollapsed(mergedPersons, mergedRootIds));
  };

  // 搜尋時：自動展開比對到的人物的所有祖先節點，並捲動到該卡片
  useEffect(() => {
    const term = search.trim();
    if (!term || !persons) return;
    const matches = Object.values(persons).filter((p) => p.name.includes(term));
    if (matches.length === 0) return;
    const ancestorIds = new Set();
    matches.forEach((m) => getAncestorChain(persons, m.id).forEach((id) => ancestorIds.add(id)));
    if (ancestorIds.size > 0) {
      setCollapsed((prev) => {
        const n = new Set(prev);
        ancestorIds.forEach((id) => n.delete(id));
        return n;
      });
      setExpanded((prev) => {
        const n = new Set(prev);
        ancestorIds.forEach((id) => n.add(id));
        return n;
      });
    }
    const t = setTimeout(() => {
      const el = document.querySelector(`[data-person-id="${matches[0].id}"]`);
      if (!el) return;
      if (viewMode === "tree" && canvasContentRef.current && canvasViewportRef.current) {
        let x = 0, y = 0, node = el;
        while (node && node !== canvasContentRef.current) { x += node.offsetLeft; y += node.offsetTop; node = node.offsetParent; }
        const targetCenterX = x + el.offsetWidth / 2;
        const targetCenterY = y + el.offsetHeight / 2;
        const vw = canvasViewportRef.current.clientWidth;
        const vh = canvasViewportRef.current.clientHeight;
        setZoom((z) => ({ scale: z.scale, x: vw / 2 - targetCenterX * z.scale, y: vh / 2 - targetCenterY * z.scale }));
      } else {
        el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
      }
    }, 150);
    return () => clearTimeout(t);
  }, [search, persons, viewMode]);

  const expandAll = () => setCollapsed(new Set());
  const collapseAll = () => {
    if (!persons) return;
    const all = new Set(Object.values(persons).filter((p) => Object.values(persons).some((c) => c.parentId === p.id)).map((p) => p.id));
    setCollapsed(all);
  };
  const expandAllList = () => {
    if (!persons) return;
    const all = new Set(Object.values(persons).filter((p) => Object.values(persons).some((c) => c.parentId === p.id)).map((p) => p.id));
    setExpanded(all);
  };
  const collapseAllList = () => setExpanded(new Set());

  const toggleTreeNode = (id) => setCollapsed((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const toggleListNode = (id) => setExpanded((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const rootIdsSet = useMemo(() => new Set(rootIds), [rootIds]);
  const generationMap = useMemo(() => (persons ? computeGenerationMap(persons, rootIds) : {}), [persons, rootIds]);

  // 樹狀圖畫布：縮放至全覽
  const fitToView = useCallback(() => {
    const viewport = canvasViewportRef.current;
    const content = canvasContentRef.current;
    if (!viewport || !content) return;
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const cw = content.offsetWidth;
    const ch = content.offsetHeight;
    if (!cw || !ch || !vw || !vh) return;
    const rawScale = Math.min(vw / cw, vh / ch) * 0.92;
    const newScale = Math.min(1.5, Math.max(0.1, rawScale));
    const newX = Math.max(12, (vw - cw * newScale) / 2);
    setZoom({ scale: newScale, x: newX, y: 16 });
  }, []);

  // 進入樹狀圖模式、資料剛載入完成時，自動縮放至全覽一次
  const hasDataFlag = !!persons;
  useEffect(() => {
    if ((viewMode === "tree" || viewMode === "radial") && hasDataFlag) {
      const t = setTimeout(fitToView, 60);
      return () => clearTimeout(t);
    }
  }, [viewMode, hasDataFlag, fitToView]);

  // 滑鼠滾輪縮放、拖曳平移、觸控雙指縮放／單指平移
  useEffect(() => {
    const viewport = canvasViewportRef.current;
    if (!viewport || (viewMode !== "tree" && viewMode !== "radial")) return;

    const isInteractive = (el) => !!(el && el.closest && el.closest("button, input, select, a, textarea"));

    const onWheel = (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      setZoom((z) => {
        const newScale = Math.min(3, Math.max(0.12, z.scale * factor));
        const contentX = (cx - z.x) / z.scale;
        const contentY = (cy - z.y) / z.scale;
        return { scale: newScale, x: cx - contentX * newScale, y: cy - contentY * newScale };
      });
    };

    let panning = false;
    let lastX = 0, lastY = 0;
    const onMouseDown = (e) => {
      if (isInteractive(e.target)) return;
      panning = true; lastX = e.clientX; lastY = e.clientY;
      viewport.style.cursor = "grabbing";
    };
    const onMouseMove = (e) => {
      if (!panning) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      setZoom((z) => ({ ...z, x: z.x + dx, y: z.y + dy }));
    };
    const onMouseUp = () => { panning = false; viewport.style.cursor = "grab"; };

    let touchMode = null;
    let touchLastX = 0, touchLastY = 0;
    let pinchStartDist = 0, pinchStartScale = 1, pinchMidX = 0, pinchMidY = 0;
    const dist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    const onTouchStart = (e) => {
      if (e.touches.length === 1) {
        if (isInteractive(e.target)) return;
        touchMode = "pan"; touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        touchMode = "pinch";
        pinchStartDist = dist(e.touches[0], e.touches[1]);
        const rect = viewport.getBoundingClientRect();
        pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        setZoom((z) => { pinchStartScale = z.scale; return z; });
      }
    };
    const onTouchMove = (e) => {
      if (touchMode === "pan" && e.touches.length === 1) {
        e.preventDefault();
        const dx = e.touches[0].clientX - touchLastX, dy = e.touches[0].clientY - touchLastY;
        touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
        setZoom((z) => ({ ...z, x: z.x + dx, y: z.y + dy }));
      } else if (touchMode === "pinch" && e.touches.length === 2) {
        e.preventDefault();
        const d = dist(e.touches[0], e.touches[1]);
        const ratio = pinchStartDist > 0 ? d / pinchStartDist : 1;
        setZoom((z) => {
          const newScale = Math.min(3, Math.max(0.12, pinchStartScale * ratio));
          const contentX = (pinchMidX - z.x) / z.scale;
          const contentY = (pinchMidY - z.y) / z.scale;
          return { scale: newScale, x: pinchMidX - contentX * newScale, y: pinchMidY - contentY * newScale };
        });
      }
    };
    const onTouchEnd = () => { touchMode = null; };

    viewport.addEventListener("wheel", onWheel, { passive: false });
    viewport.addEventListener("mousedown", onMouseDown);
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
    viewport.addEventListener("touchstart", onTouchStart, { passive: false });
    viewport.addEventListener("touchmove", onTouchMove, { passive: false });
    viewport.addEventListener("touchend", onTouchEnd);

    return () => {
      viewport.removeEventListener("wheel", onWheel);
      viewport.removeEventListener("mousedown", onMouseDown);
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
      viewport.removeEventListener("touchstart", onTouchStart);
      viewport.removeEventListener("touchmove", onTouchMove);
      viewport.removeEventListener("touchend", onTouchEnd);
    };
  }, [viewMode]);


  const rootsByEra = useMemo(() => {
    if (!persons) return [];
    return rootIds.map((id) => persons[id]).filter(Boolean).sort((a, b) => (a.birthAdYear || 0) - (b.birthAdYear || 0));
  }, [persons, rootIds]);

  // ---- 初次部署引導 ----
  if (needsSetup) {
    return (
      <div style={{ minHeight: "100vh", padding: 20 }}>
        <SetupScreen
          signedInEmail={signedInEmail}
          onSignIn={signIn}
          busy={setupBusy}
          resultFileId={setupResultFileId}
          err={setupErr}
          onCreate={async () => {
            setSetupBusy(true); setSetupErr("");
            try {
              const seed = seedData();
              seed.roles.masterEmail = signedInEmail;
              const created = await driveCreateFile(accessToken, "family-tree-data.json", seed);
              await drivePublicShare(created.id, accessToken);
              setSetupResultFileId(created.id);
            } catch (e) { setSetupErr(e.message); }
            finally { setSetupBusy(false); }
          }}
        />
      </div>
    );
  }

  if (loading) return <div style={{ padding: 40, textAlign: "center", color: "var(--muted)" }}>載入家族資料中…</div>;
  if (loadErr && !persons) return <div style={{ padding: 40, textAlign: "center", color: "var(--seal)" }}>{loadErr}</div>;
  if (!persons) return null;

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 60 }}>
      <div style={{ position: "sticky", top: 0, zIndex: 30, background: "var(--paper)", boxShadow: "0 1px 0 var(--gold)", padding: "18px 14px 0" }}>
        <header style={{ maxWidth: 980, margin: "0 auto 18px" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
            <h1 style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 900, margin: 0, letterSpacing: 2 }}>家族樹狀圖</h1>
            <span style={{ fontSize: 12, color: "var(--muted)" }}>族譜線上維護與展示</span>
          </div>
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <AuthPanel
              roles={roles} session={session} signedInEmail={signedInEmail}
              onSignIn={signIn} onSignOut={signOut}
              onClaimMaster={handleClaimMaster}
              onManage={() => setShowManage(true)}
            />
            <button onClick={() => setShowImportExport(true)} style={miniBtnStyle}>匯入／匯出</button>
          </div>
          {loadErr && <div style={{ color: "var(--seal)", fontSize: 12, marginTop: 6 }}>{loadErr}</div>}
        </header>

        <div style={{ maxWidth: 980, margin: "0 auto 18px", display: "flex", gap: "var(--toolbar-gap)", flexWrap: "wrap", alignItems: "center", borderTop: "1px solid var(--gold)", borderBottom: "1px solid var(--gold)", padding: "10px 0" }}>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            <button onClick={() => setViewMode("tree")} style={{ ...miniBtnStyle, background: viewMode === "tree" ? "var(--seal)" : "transparent", color: viewMode === "tree" ? "var(--paper)" : "var(--ink)" }}>樹狀圖</button>
            <button onClick={() => setViewMode("list")} style={{ ...miniBtnStyle, background: viewMode === "list" ? "var(--seal)" : "transparent", color: viewMode === "list" ? "var(--paper)" : "var(--ink)" }}>世代清單</button>
            <button onClick={() => setViewMode("radial")} style={{ ...miniBtnStyle, background: viewMode === "radial" ? "var(--seal)" : "transparent", color: viewMode === "radial" ? "var(--paper)" : "var(--ink)" }}>放射狀總覽</button>
          </div>

          <details className="toolbar-more">
            <summary style={{ ...miniBtnStyle, display: "inline-flex" }}>更多功能 ▾</summary>
            <div>
              {viewMode === "tree" && (
                <React.Fragment>
                  <button onClick={expandAll} style={miniBtnStyle}>展開全部</button>
                  <button onClick={collapseAll} style={miniBtnStyle}>收合全部</button>
                </React.Fragment>
              )}
              {viewMode === "list" && (
                <React.Fragment>
                  <button onClick={expandAllList} style={miniBtnStyle}>展開全部</button>
                  <button onClick={collapseAllList} style={miniBtnStyle}>收合全部</button>
                </React.Fragment>
              )}
              {(viewMode === "tree" || viewMode === "radial") && (
                <React.Fragment>
                  <button onClick={fitToView} style={miniBtnStyle}>縮放至全覽</button>
                  <button onClick={() => setZoom((z) => ({ ...z, scale: Math.min(3, z.scale * 1.2) }))} style={miniBtnStyle}>＋</button>
                  <button onClick={() => setZoom((z) => ({ ...z, scale: Math.max(0.12, z.scale * 0.8) }))} style={miniBtnStyle}>－</button>
                </React.Fragment>
              )}
              <button
                onClick={() => setPresentMode((v) => !v)}
                style={{ ...miniBtnStyle, background: presentMode ? "var(--jade)" : "transparent", color: presentMode ? "var(--paper)" : "var(--ink)", borderColor: "var(--jade)" }}
                title="簡報總覽：只顯示姓名、西元年份與配偶姓名，適合展示給家人看"
              >
                {presentMode ? "簡報總覽中（點擊回完整資料）" : "切換為簡報總覽"}
              </button>
            </div>
          </details>

          <div style={{ display: "flex", alignItems: "center", gap: 6, flex: 1, minWidth: 160 }}>
            <input style={{ ...inputStyle, maxWidth: 220 }} placeholder="搜尋姓名…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
        </div>
      </div>

      <main style={{ maxWidth: 980, margin: "0 auto", padding: "18px 14px 0" }}>
        {(viewMode === "tree" || viewMode === "radial") && (
          <div
            ref={canvasViewportRef}
            style={{
              position: "relative", width: "100%", height: "68vh", minHeight: 420,
              overflow: "hidden", border: "1px solid var(--gold)", borderRadius: 8,
              background: "var(--paper)", cursor: "grab", touchAction: "none",
            }}
          >
            <div
              ref={canvasContentRef}
              style={{
                position: "absolute", top: 0, left: 0, userSelect: "none",
                transformOrigin: "0 0",
                transform: `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.scale})`,
              }}
            >
              <div style={{ display: "flex", flexDirection: viewMode === "radial" ? "row" : "column", flexWrap: viewMode === "radial" ? "wrap" : "nowrap", gap: 30, padding: "4px 4px 20px" }}>
                {rootsByEra.map((root) => (
                  <div key={root.id}>
                    <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8, fontFamily: "var(--font-display)" }}>{root.generationEra}</div>
                    {viewMode === "tree" ? (
                      <TreeNode id={root.id} persons={persons} collapsed={collapsed} toggle={toggleTreeNode} onEdit={openEdit} onAddChild={openAddChild} onAddSpouse={openAddSpouse} onAddParent={openAddParent} rootIdsSet={rootIdsSet} canEditFn={canEditPerson} highlight={search.trim()} presentMode={presentMode} generationMap={generationMap} />
                    ) : (
                      <RadialTree id={root.id} persons={persons} highlight={search.trim()} generationMap={generationMap} />
                    )}
                  </div>
                ))}
              </div>
            </div>
            <div style={{ position: "absolute", bottom: 8, right: 10, fontSize: 11, color: "var(--muted)" }}>滾輪／雙指縮放．拖曳平移</div>
          </div>
        )}
        {viewMode === "list" && (
          <div>
            {rootsByEra.map((root) => (
              <div key={root.id} style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4, fontFamily: "var(--font-display)" }}>{root.generationEra}</div>
                <ListNode id={root.id} persons={persons} depth={0} expanded={expanded} toggle={toggleListNode} onEdit={openEdit} onAddChild={openAddChild} onAddSpouse={openAddSpouse} onAddParent={openAddParent} rootIdsSet={rootIdsSet} canEditFn={canEditPerson} highlight={search.trim()} presentMode={presentMode} generationMap={generationMap} />
              </div>
            ))}
          </div>
        )}
      </main>

      {formState && formState.mode === "parent" && (
        <AddParentForm
          otherRoots={rootIds.filter((id) => id !== formState.personId).map((id) => persons[id]).filter(Boolean)}
          onCancel={() => setFormState(null)}
          onCreateNew={handleCreateNewAncestor}
          onAttachExisting={handleAttachExistingAncestor}
        />
      )}
      {formState && formState.mode !== "parent" && (
        <PersonForm mode={formState.mode} initial={formState.initial || persons[formState.personId]} onCancel={() => setFormState(null)} onSave={handleSaveForm} onDelete={formState.mode === "edit" ? handleDeletePerson : null} allPersons={persons} personId={formState.personId} isRoot={rootIdsSet.has(formState.personId)} />
      )}
      {showManage && roles && (
        <ManagePanel roles={roles} persons={persons} fileId={CONFIG.FILE_ID} accessToken={accessToken} onClose={() => setShowManage(false)} onAddRole={handleAddRole} onRemoveRole={handleRemoveRole} />
      )}
      {showImportExport && persons && (
        <ImportExportPanel
          persons={persons} rootIds={rootIds} roles={roles}
          canImport={!!session && (session.role === "master" || session.role === "sub")}
          onClose={() => setShowImportExport(false)}
          onImportData={handleImportData}
        />
      )}

      <footer style={{ maxWidth: 980, margin: "30px auto 0", padding: "0 14px", fontSize: 11, color: "var(--muted)", textAlign: "center" }}>
        資料存放於 Google Drive；訪客可直接瀏覽（唯讀），登入 Google 帳號並取得授權後可依角色編輯。
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<script>
  // 手動轉譯上方原始碼，強制使用「classic」JSX 轉換模式（React.createElement），
  // 避免新版 Babel 預設的「automatic」模式插入 import 陳述式，
  // 因為這段程式碼是在瀏覽器裡以純 <script> 執行，並非模組（module），不支援 import。
  (function () {
    var source = document.getElementById("app-source").textContent;
    try {
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var script = document.createElement("script");
      script.textContent = output;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;color:#9B2E23;font-family:sans-serif;">程式碼編譯失敗：' +
        (e && e.message ? e.message : String(e)) +
        "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
